<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="logo2.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Social Grid</title>
    <link rel="stylesheet" href="home.css">
    <script src="home.js" defer></script>
</head>
<body>
    <div id="app-bar">
        <header class="top-bar">
            <a href="home.html"><img src="logo.png" id="logo" alt="Social Grid Logo"></a>
            <div class="search-container">
                <input type="search" id="search-input" class="search-input" placeholder="Search posts, users, tags..." aria-label="Search" onkeydown="if(event.key==='Enter')console.log('Searching:',this.value)">
                <img src="search.png" class="search-icon" alt="">
            </div>
           <img src="unkown.png" id="profile-img" alt="User Profile" class="profile-btn" tabindex="0" onclick="loadUserPage(localStorage.getItem('username'))">
        </header>
    </div>

    <main class="layout">
        <nav class="sidebar left-sidebar" aria-label="Main Navigation">
            <a href="#" class="nav-item active" onclick="setActive(this,event)">
                <img src="home.png" alt="" class="nav-icon"><span class="nav-label">Home</span>

            </a>
            <a href="/messages.html" class="nav-item"> <img src="chat.png" alt="" class="nav-icon"><span class="nav-label">chat</span></a>
            <a href="#" class="nav-item" onclick="setActive(this,event)">
                <img src="search2.png" alt="" class="nav-icon"><span class="nav-label">Explore</span>
            </a>
            <a href="#" class="nav-item" onclick="setActive(this,event)">
                <img src="save.png" alt="" class="nav-icon"><span class="nav-label">Saved</span>
            </a>
            <a href="#" class="nav-item" onclick="setActive(this,event)">
                <img src="setting.png" alt="" class="nav-icon"><span class="nav-label">Settings</span>
            </a>
        </nav>

        <section class="feed center-feed" aria-label="Post Feed" id="feed-container">
            <div id="add-post">
                <div class="add-post-header">
                    <img src="unkown.png" id="text">
                    <textarea id="post-content" placeholder="What's happening?"></textarea>
                </div>
                <div class="preview-wrap" id="preview-wrap">
                    <img id="preview">
                    <button class="cancel-btn" onclick="cancelImage()">✕</button>
                </div>
                <div class="add-post-actions">
                    <div class="add-icons">
    <label for="post-image" title="Add Image">
        <img src="image.png" alt="Image">
    </label>
    <input type="file" id="post-image" accept="image/*" style="display:none;">
    

    <label for="post-video" title="Add Video (Max 20MB)">
        <img src="video.png" width="20px" class="video" alt="Video" style="opacity:0.8; width: 27px;">
    </label>
    <input type="file" id="post-video" accept="video/mp4,video/webm,video/quicktime" style="display:none;">
</div>
                    <a class="post-btn"  onclick="addPost()"><img src="post.png" alt=""><a>
                </div>
            </div>
        </section>

        <aside class="sidebar right-sidebar" aria-label="Friends List">
            <h3 class="sidebar-title">Friends</h3>
            <div class="friend-list">
                
            </div>
        </aside>
    </main>

    <dialog id="v"><img src="" onclick="closeFull()"></dialog>
    <dialog id="confirm-post">
        <div class="confirm-box">
            <h3>Post preview</h3>
            <p id="confirm-text"></p>
            <img id="confirm-img">
            <div class="confirm-actions">
                <button onclick="submitPost()">Confirm</button>
                <button onclick="closeConfirm()">Cancel</button>
            </div>
        </div>
    </dialog>
    <div id="toast" class="toast"></div>
    <dialog id="post-options-dialog">
    <div class="options-box">
        <button onclick="openEditDialog()">Edit Post</button>
        <button onclick="deleteCurrentPost()" style="color:#ef4444;">Delete Post</button>
        <button onclick="document.getElementById('post-options-dialog').close()">Cancel</button>
    </div>
</dialog>

<dialog id="edit-dialog">
    <div class="edit-box">
        <h3 style="margin:0 0 10px;font-size:16px;color:var(--text-primary);">Edit Post</h3>
        <textarea id="edit-content" placeholder="Update your post..."></textarea>
        <div id="edit-preview"></div>
        <label for="edit-image" class="edit-img-label">Change Image (Optional)</label>
        <input type="file" id="edit-image" accept="image/*" style="display:none;">
        <div class="edit-actions">
            <button onclick="saveEdit()">Save Changes</button>
            <button onclick="document.getElementById('edit-dialog').close()">Cancel</button>
        </div>
    </div>
</dialog>

<dialog id="edit-profile-dialog">
    <div class="edit-profile-box">
        <h3>Edit Profile</h3>
        <form id="edit-profile-form" onsubmit="event.preventDefault(); saveProfileChanges();">
            <div class="profile-pic-section">
                <img id="edit-profile-preview" src="unkown.png">
                <label for="edit-profile-image" class="upload-btn">Change Photo</label>
                <input type="file" id="edit-profile-image" accept="image/*" style="display:none;">
            </div>
            <center><p style="margin: 4px; text-shadow: 0px 0px 70px red; color: red;" id="error-global"></center>
            <input type="text" id="edit-name" placeholder="Full Name" required>
            
            <input type="text" id="edit-username" placeholder="Username" required>
            <center><p style="margin: 4px; text-shadow: 0px 0px 40px red; color: red;" id="error-user"></p></center>
            <input type="email" id="edit-email" placeholder="Email (Optional)">
            <center><p style="margin: 4px; text-shadow: 0px 0px 70px red; color: red;" id="error-email"></p></center>
            <input type="tel" id="edit-phone" placeholder="Phone (Optional)">
            <center><p style="margin: 4px; text-shadow: 0px 0px 70px red; color: red;" id="error-phone"></p></center>
            <div id="password-section" style="display:none; margin-top:10px;">
                <input type="password" id="edit-old-pass" placeholder="Old Password">
                <center><p style="margin: 4px; text-shadow: 0px 0px 70px red; color: red;" id="error-old-pass"></p></center>
                <input type="password" id="edit-new-pass" placeholder="New Password">
                <center><p style="margin: 4px; text-shadow: 0px 0px 70px red; color: red;" id="error-new-pass"></p></center>
                <input type="password" id="edit-confirm-pass" placeholder="Confirm New Password">
                <center><p style="margin: 4px; text-shadow: 0px 0px 70px red; color: red;" id="error-conf-pass"></p></center>
            </div>
            <button type="button" class="toggle-pass-btn" onclick="togglePasswordSection()">🔒 Change Password</button>

            <div class="form-actions">
                <button type="submit" class="save-btn">Save Changes</button>
                
    <button type="button" id="edit-profile-cancel" onclick="document.getElementById('edit-profile-dialog').close()">Cancel</button>

            </div>
        </form>
    </div>
</dialog>
<div id="toast-container" class="toast-container"></div>

</body>
</html>
